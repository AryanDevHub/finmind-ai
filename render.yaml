services:
  # ── Backend — FastAPI ─────────────────────────────────────────
  - type: web
    name: finmind-ai-backend
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head || true
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://finmind-ai-six.vercel.app

  # ── Web Frontend — Modern Swiss Minimalist UI (Vite) ──────────
  - type: static
    name: finmind-ai-web
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://finmind-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Legacy Frontend — Streamlit ───────────────────────────────
  - type: web
    name: finmind-ai-frontend
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements-frontend.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_URL
        value: https://finmind-ai-backend.onrender.com

databases:
  - name: finmind-db
    plan: free